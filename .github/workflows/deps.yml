name: deps
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: caching
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{hashFiles('requirements.txt')}}
          restore-keys: |
            pip-
      - name: installing
        run: pip install -r requirements.txt
