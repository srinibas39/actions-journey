name: handoff
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: create file
        run: echo "package" > app.txt
      - name: Upload file
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: app.txt
  verify:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: downloads file
        uses: actions/download-artifact@v4
        with:
          name: app-package
      - name: Verify file
        run: test -f app.txt
